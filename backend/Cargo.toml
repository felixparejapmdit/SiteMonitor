[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SiteMonitor API server: Axum + SeaORM (PostgreSQL) + Tokio crons + WebSocket hub."

[dependencies]
shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }

axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip", "set-header"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio-cron-scheduler = "0.15"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
dotenvy = "0.15"
