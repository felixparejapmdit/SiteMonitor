<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{app_title}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="SiteMonitor — construction, maintenance and equipment for the whole estate, in one calm place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paint the calm background before the app loads — no white flash. */
      html, body { margin: 0; background: #ffffff; color: #37352f; font-family: Inter, -apple-system, sans-serif; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #ffffff; transition: opacity .25s ease; z-index: 1; }
      #boot .mark { width: 44px; height: 44px; border-radius: 12px; background: #37352f; color: #fff; display: flex; align-items: center; justify-content: center; font: 600 18px Georgia, serif; }
      #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: #ededed; overflow: hidden; }
      #boot .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #787774; border-radius: 3px; animation: boot 1.1s ease-in-out infinite; }
      #boot p { margin: 0; font-size: 13px; color: #787774; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      body.app-ready #boot { opacity: 0; pointer-events: none; }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="mark">S</div><div class="bar"></div><p>Loading your estate…</p></div>
    <div id="main"></div>
  </body>
</html>
