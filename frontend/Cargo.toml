[package]
name = "frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SiteMonitor PWA: Dioxus WASM frontend for the estate owner and the site team."

[dependencies]
shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }

dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "DomRect", "Navigator", "Location", "Storage",
    "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlImageElement", "HtmlInputElement",
    "File", "FileList", "Blob", "Url", "FileReader",
    "IdbFactory", "IdbDatabase", "IdbOpenDbRequest", "IdbRequest", "IdbTransaction",
    "IdbTransactionMode", "IdbObjectStore", "IdbObjectStoreParameters", "IdbVersionChangeEvent",
    "IdbCursorWithValue", "IdbKeyRange", "Event", "EventTarget", "CustomEvent",
    "ServiceWorkerContainer", "MediaQueryList", "ScrollIntoViewOptions", "ScrollBehavior", "ScrollLogicalPosition", "DomTokenList",
] }
